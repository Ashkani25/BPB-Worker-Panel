name: Attach APK to release
on:
  push:
    branches: ['attach-apk']
permissions:
  contents: write
  actions: read
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact and attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/14526386964/zip > apks.zip
          unzip -o apks.zip 'ANIX-arm64-v8a.apk' 'ANIX-universal.apk'
          gh release upload anix-games-1 ANIX-arm64-v8a.apk ANIX-universal.apk --clobber -R ${{ github.repository }}
